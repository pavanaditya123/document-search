name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pytest -q tests

  alert-rules:
    name: Alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rules are valid and their tests pass
        run: |
          docker run --rm -v "$PWD/ops:/rules" -w /rules --entrypoint promtool \
            prom/prometheus:v2.55.1 check rules alerts.yml
          docker run --rm -v "$PWD/ops:/rules" -w /rules --entrypoint promtool \
            prom/prometheus:v2.55.1 test rules alerts.test.yml

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t document-search:ci .

      # The scheduled eval job once failed because the API crashed at startup
      # without a LOGFIRE_TOKEN. Boot the image with no token and placeholder
      # keys (nothing is called at startup) and wait for /health.
      - name: API starts without optional credentials
        run: |
          docker run -d --name api -p 8000:8000 \
            -e GROQ_API_KEY=placeholder -e GROQ_FALLBACK_API_KEY=placeholder \
            -e LANGSMITH_TRACING=false \
            document-search:ci uvicorn app.main:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health && exit 0
            sleep 3
          done
          docker logs api | tail -60; exit 1
